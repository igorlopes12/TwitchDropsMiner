<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Twitch Drops Miner</title>
</head>
<body>
<pre id="out"></pre>
<script>
  window.tdm = {
    on(event, payload) {
      const out = document.getElementById("out");
      out.textContent = event + ": " + JSON.stringify(payload) + "\n" + out.textContent;
    },
  };
</script>
</body>
</html>
